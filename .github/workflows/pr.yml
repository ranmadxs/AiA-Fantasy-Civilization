name: PR Checks

on:
  pull_request:
    branches: [product]

permissions:
  contents: read
  pull-requests: write

jobs:
  semver-check:
    name: Semver Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check package.json was bumped
        run: |
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            echo "Comparando package.json entre ${BASE_SHA:0:7} (base) y ${HEAD_SHA:0:7} (head)"

            # Verificar que package.json fue modificado en AI Civilization o Fantasy-Map-Generator
            MODIFIED=$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" | grep -E '(^package\.json$|^fantasy-map-generator/package\.json$)' || true)
            if [ -z "$MODIFIED" ]; then
              echo "❌ package.json NO fue modificado en este PR"
              echo ""
              echo "Política del proyecto: TODO PR debe bumbear la versión en"
              echo "package.json siguiendo semver."
              exit 1
            fi

            echo "✅ package.json modificado: $MODIFIED"

  build-check:
    name: Build & TypeScript Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    permissions:
      contents: read

    steps:
      - name: Check if any job failed
        if: always()
        run: |
          RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs")
          FAILED=$(echo "$RESPONSE" | python3 -c "import sys,json;[print(j['name']) for j in json.load(sys.stdin)['jobs'] if j['name']!='${{ github.job }}' and j['conclusion'] in ('failure','cancelled','skipped')][:1]")
          if [ -n "$FAILED" ]; then
            echo "❌ Job $FAILED failed, skipping"
            exit 1
          fi
        shell: bash

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout Fantasy Map Generator
        uses: actions/checkout@v7
        with:
          repo: Azgaar/Fantasy-Map-Generator
          path: Fantasy-Map-Generator
          fetch-depth: 0

      - name: Symlink FMG for workspace
        run: ln -sf "$GITHUB_WORKSPACE/Fantasy-Map-Generator" "$GITHUB_WORKSPACE/../Fantasy-Map-Generator" || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: |
          npm install -g pnpm@9.15.0
          echo "$(npm config get prefix)/bin" >> $GITHUB_PATH
          pnpm --version

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: TypeScript check
        run: |
          pnpm build

      - name: Build Fantasy Map Generator library
        run: |
          cd Fantasy-Map-Generator && pnpm run build:lib

  simulation-check:
    name: Simulation Smoke Test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    permissions:
      contents: read

    steps:
      - name: Check if any job failed
        if: always()
        run: |
          RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs")
          FAILED=$(echo "$RESPONSE" | python3 -c "import sys,json;[print(j['name']) for j in json.load(sys.stdin)['jobs'] if j['name']!='${{ github.job }}' and j['conclusion'] in ('failure','cancelled','skipped')][:1]")
          if [ -n "$FAILED" ]; then
            echo "❌ Job $FAILED failed, skipping"
            exit 1
          fi
        shell: bash

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout Fantasy Map Generator
        uses: actions/checkout@v7
        with:
          repo: Azgaar/Fantasy-Map-Generator
          path: Fantasy-Map-Generator
          fetch-depth: 0

      - name: Symlink FMG for workspace
        run: ln -sf "$GITHUB_WORKSPACE/Fantasy-Map-Generator" "$GITHUB_WORKSPACE/../Fantasy-Map-Generator" || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: |
          npm install -g pnpm@9.15.0
          echo "$(npm config get prefix)/bin" >> $GITHUB_PATH
          pnpm --version

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Run smoke simulation
        run: |
          pnpm smoke:simulation

  unit-tests-fmg:
    name: Fantasy Map Generator Unit Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    permissions:
      contents: read

    steps:
      - name: Checkout AI Civilization
        uses: actions/checkout@v7

      - name: Checkout Fantasy Map Generator
        uses: actions/checkout@v7
        with:
          repo: Azgaar/Fantasy-Map-Generator
          path: Fantasy-Map-Generator
          fetch-depth: 0

      - name: Symlink FMG for workspace
        run: ln -sf "$GITHUB_WORKSPACE/Fantasy-Map-Generator" "$GITHUB_WORKSPACE/../Fantasy-Map-Generator" || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm@9.15.0

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          cd Fantasy-Map-Generator && pnpm install --frozen-lockfile

      - name: Run FMG unit tests
        run: |
          cd Fantasy-Map-Generator && pnpm test --run
