version: "3.8"

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - PORT=5173
      - HOST=0.0.0.0
      - LLM_PROVIDER=${LLM_PROVIDER}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_API_KEY=${LLM_API_KEY}
    command: pnpm dev --host 0.0.0.0

  build:
    build:
      context: .
      dockerfile: Dockerfile
      target: preview
    ports:
      - "4173:4173"

  smoke:
    build:
      context: .
      dockerfile: Dockerfile
      target: smoke
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_API_KEY=${LLM_API_KEY}
    command: pnpm smoke:simulation

  preview:
    build:
      context: .
      dockerfile: Dockerfile
      target: preview
    ports:
      - "4173:4173"
